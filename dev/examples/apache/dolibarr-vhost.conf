# Example Apache 2.4 virtual host for Dolibarr with the MVC front controller (htdocs/app.php).
# Needs: a2enmod rewrite proxy proxy_fcgi headers
# Same semantics as docker/nginx and htdocs/.htaccess, but inline (no .htaccess needed).
<VirtualHost *:80>
    ServerName dolibarr.example.com
    DocumentRoot /var/www/dolibarr/htdocs

    # Dolibarr REST API: api/index.php/explorer/...
    AcceptPathInfo On

    <Directory /var/www/dolibarr/htdocs>
        Require all granted
        AllowOverride None
        Options -Indexes
        DirectoryIndex index.php
        DirectorySlash Off

        RewriteEngine On
        # Subdirectory install: RewriteBase /dolibarr/
        # 1. Source code is never served
        RewriteRule ^src/ - [F,L]

        # 2. Static assets: served if present, otherwise a plain 404 (never app.php: no session, no database)
        RewriteCond %{REQUEST_URI} \.(png|jpe?g|gif|svg|webp|ico|css|js|map|woff2?|ttf|eot)$ [NC]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ - [R=404,L]

        # 3. Existing files are served as is (.php executed by PHP-FPM; PATH_INFO such as api/index.php/explorer/ is kept)
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^ - [L]

        # 4. A directory with an index.php runs that script (never served raw)
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteCond %{REQUEST_FILENAME}/index.php -f
        RewriteRule ^(.*?)/?$ /$1/index.php [L]

        # 5. Anything else (unknown path, directory without index.php, missing .php) goes to the MVC front controller.
        #    REQUEST_URI is preserved: the kernel routes on it.
        RewriteRule ^ app.php [L]
    </Directory>

    # PHP through PHP-FPM (adapt host:port or use unix:/run/php/php8.3-fpm.sock|fcgi://localhost)
    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://php-fpm:9000"
    </FilesMatch>

    # Never execute PHP from external libraries; conf is private
    <Directory /var/www/dolibarr/htdocs/includes>
        <FilesMatch \.php$>
            SetHandler !
        </FilesMatch>
    </Directory>
    <Directory /var/www/dolibarr/htdocs/conf>
        Require all denied
    </Directory>

    # Usual security headers (uncomment to enable)
    #Header always set X-Content-Type-Options "nosniff"
    #Header always set X-Frame-Options "SAMEORIGIN"
    #Header always set Referrer-Policy "strict-origin-when-cross-origin"
    #Header always set Strict-Transport-Security "max-age=31536000" # HTTPS only

    # Logs (adapt the path: /var/log/apache2 on Debian, /var/log/httpd on RHEL)
    #ErrorLog /var/log/apache2/dolibarr-error.log
    #CustomLog /var/log/apache2/dolibarr-access.log combined
</VirtualHost>
